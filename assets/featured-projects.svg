      <rect x="257" y="0" width="75" height="20" rx="4" fill="#201138" stroke="#a855f7" stroke-width="0.6" />
      <text x="294.5" y="14" fill="#d8b4fe" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">REST APIs</text>

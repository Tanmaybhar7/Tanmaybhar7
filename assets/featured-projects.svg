<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="projCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b17" />
      <stop offset="100%" stop-color="#0b1326" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="projGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseP1 { 0%, 100% { stroke: #00f2fe; stroke-opacity: 0.85; } 50% { stroke: #38bdf8; stroke-opacity: 0.25; } }
    @keyframes pulseP2 { 0%, 100% { stroke: #a855f7; stroke-opacity: 0.85; } 50% { stroke: #ec4899; stroke-opacity: 0.25; } }
    @keyframes pulseP3 { 0%, 100% { stroke: #10b981; stroke-opacity: 0.85; } 50% { stroke: #00f5d4; stroke-opacity: 0.25; } }
    @keyframes pulseP4 { 0%, 100% { stroke: #f59e0b; stroke-opacity: 0.85; } 50% { stroke: #fbbf24; stroke-opacity: 0.25; } }

    @keyframes floatIconProj {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    @keyframes pulseDotLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }
    
    .card-p1 { animation: pulseP1 4s ease-in-out infinite 0s; }
    .card-p2 { animation: pulseP2 4s ease-in-out infinite 1s; }
    .card-p3 { animation: pulseP3 4s ease-in-out infinite 2s; }
    .card-p4 { animation: pulseP4 4s ease-in-out infinite 3s; }
    
    .icon-p1 { animation: floatIconProj 3s ease-in-out infinite 0s; }
    .icon-p2 { animation: floatIconProj 3s ease-in-out infinite 0.75s; }
    .icon-p3 { animation: floatIconProj 3s ease-in-out infinite 1.5s; }
    .icon-p4 { animation: floatIconProj 3s ease-in-out infinite 2.25s; }

    .live-p { animation: pulseDotLive 2s ease-in-out infinite; }
  </style>

  <!-- ================= PROJECT 1: MAUSAM ================= -->
  <g transform="translate(10, 10)">
    <rect width="460" height="215" rx="12" fill="url(#projCardBg)" stroke="#00f2fe" stroke-width="1.2" class="card-p1" />
    
    <!-- Top HUD Bar -->
    <g transform="translate(20, 18)">
      <circle cx="6" cy="6" r="4" fill="#00f2fe" class="live-p" />
      <text x="18" y="9.5" fill="#38bdf8" font-family="'Courier New', monospace" font-size="10" font-weight="700" letter-spacing="1">REACT 19 SPA // GEO-CLIMATE</text>
      <rect x="340" y="-3" width="80" height="18" rx="4" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-width="0.6" />
      <text x="380" y="9.5" fill="#00f2fe" font-family="'Courier New', monospace" font-size="9" font-weight="700" text-anchor="middle">FEATURED</text>
    </g>

    <!-- Title & Icon -->
    <g transform="translate(20, 52)">
      <text x="0" y="0" font-size="18" class="icon-p1">🌦️</text>
      <text x="28" y="-1" fill="#ffffff" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="700">Mausam Weather Platform</text>
    </g>

    <!-- Subtitle -->
    <text x="20" y="82" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">
      Next-Gen Interactive Climate &amp; Geospatial Intelligence SPA
    </text>

    <!-- Description -->
    <text x="20" y="104" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11.5">
      Interactive live weather dashboard with REST API integration,
    </text>
    <text x="20" y="122" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11.5">
      dynamic hourly charts, responsive layouts &amp; smooth UI/UX.
    </text>

    <!-- Tech Chips -->
    <g transform="translate(20, 142)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="68" height="20" rx="4" fill="#0e1f38" stroke="#00f2fe" stroke-width="0.6" />
      <text x="34" y="14" fill="#38bdf8" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">React 19</text>
      <!-- Chip 2 -->
      <rect x="74" y="0" width="80" height="20" rx="4" fill="#0e1f38" stroke="#00f2fe" stroke-width="0.6" />
      <text x="114" y="14" fill="#38bdf8" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">TypeScript</text>
      <!-- Chip 3 -->
      <rect x="160" y="0" width="75" height="20" rx="4" fill="#0e1f38" stroke="#00f2fe" stroke-width="0.6" />
      <text x="197.5" y="14" fill="#38bdf8" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">JavaScript</text>
      <!-- Chip 4 -->
      <rect x="241" y="0" width="70" height="20" rx="4" fill="#0e1f38" stroke="#00f2fe" stroke-width="0.6" />
      <text x="276" y="14" fill="#38bdf8" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">REST APIs</text>
      <!-- Chip 5 -->
      <rect x="317" y="0" width="70" height="20" rx="4" fill="#0e1f38" stroke="#00f2fe" stroke-width="0.6" />
      <text x="352" y="14" fill="#38bdf8" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">Figma UI</text>
    </g>

    <!-- Action Link Indicator -->
    <g transform="translate(20, 182)">
      <rect width="165" height="20" rx="4" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-width="0.7" />
      <text x="10" y="14" fill="#00f2fe" font-family="'Courier New', monospace" font-size="10" font-weight="700">➔ VIEW_CODEBASE // REPO</text>
    </g>
  </g>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 140" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050812" />
      <stop offset="100%" stop-color="#090e1c" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#00f5d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </linearGradient>

    <filter id="footGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes wavePulse {
      0%, 100% { opacity: 0.7; transform: scaleY(1); }
      50% { opacity: 1; transform: scaleY(1.15); }
    }
    .wave-effect {
      animation: wavePulse 4s ease-in-out infinite;
      transform-origin: 480px 10px;
    }
  </style>

  <!-- Base container -->
  <rect width="960" height="140" rx="14" fill="url(#footerBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Top Accent Glowing Line -->
  <path d="M 40 10 Q 240 2 480 10 T 920 10" fill="none" stroke="url(#glowLine)" stroke-width="2.5" class="wave-effect" filter="url(#footGlow)" />

  <!-- Content Centered -->
  <g transform="translate(480, 50)" text-anchor="middle">
    <!-- Tagline -->
    <text y="0" fill="#f8fafc" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="700" letter-spacing="1">
      KEEP BUILDING. KEEP BREAKING. KEEP LEARNING.
    </text>
    
    <text y="24" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500">
      Crafted with precision &amp; passion for the modern web • Thanks for exploring
    </text>

    <!-- Cyber Code Signature -->
    <g transform="translate(0, 56)">
      <rect x="-85" y="-16" width="170" height="26" rx="6" fill="#0b1328" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.8" />
      <text x="0" y="1" fill="#00f2fe" font-family="'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="2">
        &lt;/tanmay.bhar&gt;
      </text>
    </g>
  </g>
</svg>

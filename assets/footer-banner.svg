<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 145" width="100%" height="100%">
  <defs>
    <linearGradient id="footerBgAdv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040712" />
      <stop offset="50%" stop-color="#080e1c" />
      <stop offset="100%" stop-color="#050914" />
    </linearGradient>

    <linearGradient id="glowWaveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#00f5d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </linearGradient>

    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes wavePulse1 {
      0%, 100% { opacity: 0.8; transform: scaleY(1); }
      50% { opacity: 1; transform: scaleY(1.2); }
    }
    @keyframes wavePulse2 {
      0%, 100% { opacity: 0.5; transform: scaleY(1.1); }
      50% { opacity: 0.9; transform: scaleY(0.9); }
    }
    .wave-a { animation: wavePulse1 4s ease-in-out infinite; transform-origin: 480px 10px; }
    .wave-b { animation: wavePulse2 3s ease-in-out infinite; transform-origin: 480px 10px; }
  </style>

  <!-- Base container -->
  <rect width="960" height="145" rx="14" fill="url(#footerBgAdv)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Dual Neon Waves -->
  <path d="M 40 12 Q 240 2 480 12 T 920 12" fill="none" stroke="url(#glowWaveGrad)" stroke-width="3" class="wave-a" filter="url(#waveGlow)" />
  <path d="M 60 14 Q 280 22 480 10 T 900 14" fill="none" stroke="#00f2fe" stroke-width="1" class="wave-b" opacity="0.4" />

  <!-- Content Centered -->
  <g transform="translate(480, 52)" text-anchor="middle">
    <!-- Tagline -->
    <text y="0" fill="#ffffff" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16.5" font-weight="800" letter-spacing="1.5">
      KEEP BUILDING. KEEP BREAKING. KEEP LEARNING.
    </text>
    
    <text y="26" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500">
      Crafted with precision &amp; passion for Web, Mobile &amp; UI/UX • Tanmay Bhar (BCA @ Brainware)
    </text>

    <!-- Cyber Code Signature Pill -->
    <g transform="translate(0, 58)">
      <rect x="-95" y="-16" width="190" height="28" rx="6" fill="#081022" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.9" />
      <text x="0" y="2" fill="#00f2fe" font-family="'Courier New', monospace" font-size="13.5" font-weight="700" letter-spacing="2">
        &lt;/tanmay.bhar&gt;
      </text>
    </g>
  </g>
</svg>

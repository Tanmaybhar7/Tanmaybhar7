<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 175" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBgAdv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="100%" stop-color="#0a1224" />
    </linearGradient>

    <linearGradient id="flowBeamAdv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#4facfe" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>

    <filter id="glowPipeAdv" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseCardPipe1 { 0%, 100% { stroke: #00f2fe; stroke-opacity: 0.8; } 50% { stroke: #38bdf8; stroke-opacity: 0.25; } }
    @keyframes pulseCardPipe2 { 0%, 100% { stroke: #4facfe; stroke-opacity: 0.8; } 50% { stroke: #60a5fa; stroke-opacity: 0.25; } }
    @keyframes pulseCardPipe3 { 0%, 100% { stroke: #a855f7; stroke-opacity: 0.8; } 50% { stroke: #c084fc; stroke-opacity: 0.25; } }
    @keyframes pulseCardPipe4 { 0%, 100% { stroke: #00f5d4; stroke-opacity: 0.8; } 50% { stroke: #2dd4bf; stroke-opacity: 0.25; } }
    
    @keyframes dashMove {
      0% { stroke-dashoffset: 160; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes orbTravel {
      0% { cx: 120px; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 840px; opacity: 0; }
    }
    .flow-dash {
      stroke-dasharray: 8, 8;
      animation: dashMove 3s linear infinite;
    }
    .energy-orb {
      animation: orbTravel 4s ease-in-out infinite;
    }
    .c-pipe-1 { animation: pulseCardPipe1 3s ease-in-out infinite 0s; }
    .c-pipe-2 { animation: pulseCardPipe2 3s ease-in-out infinite 0.75s; }
    .c-pipe-3 { animation: pulseCardPipe3 3s ease-in-out infinite 1.5s; }
    .c-pipe-4 { animation: pulseCardPipe4 3s ease-in-out infinite 2.25s; }
  </style>

  <!-- Base background -->
  <rect width="960" height="175" rx="14" fill="url(#pipeBgAdv)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Connecting Animated Pipeline Line -->
  <line x1="120" y1="87" x2="840" y2="87" stroke="#1e293b" stroke-width="4" />
  <line x1="120" y1="87" x2="840" y2="87" stroke="url(#flowBeamAdv)" stroke-width="2.5" class="flow-dash" filter="url(#glowPipeAdv)" />

  <!-- Moving Glowing Energy Photon -->
  <circle cy="87" r="6" fill="#00f2fe" class="energy-orb" filter="url(#glowPipeAdv)" />

  <!-- ================= STAGE 1 ================= -->
  <g transform="translate(20, 20)">
    <rect width="200" height="135" rx="10" fill="#081022" stroke="#00f2fe" stroke-width="1.2" class="c-pipe-1" />
    <circle cx="20" cy="22" r="12" fill="#00f2fe" fill-opacity="0.15" />
    <text x="20" y="26" fill="#00f2fe" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" text-anchor="middle">01</text>
    <text x="40" y="26" fill="#38bdf8" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1">ARCHITECT</text>
    
    <text x="14" y="60" fill="#ffffff" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="700">Problem &amp; Schema</text>
    <text x="14" y="80" fill="#94a3b8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11">Database modeling</text>
    <text x="14" y="96" fill="#94a3b8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11">API contracts &amp; UX flows</text>
    
    <rect x="14" y="110" width="85" height="15" rx="3" fill="#00f2fe" fill-opacity="0.12" stroke="#00f2fe" stroke-width="0.6" />
    <text x="20" y="121" fill="#00f2fe" font-family="'Courier New', monospace" font-size="9" font-weight="700">SYS_DESIGN</text>
  </g>

  <!-- ================= STAGE 2 ================= -->
  <g transform="translate(260, 20)">
    <rect width="200" height="135" rx="10" fill="#081022" stroke="#4facfe" stroke-width="1.2" class="c-pipe-2" />
    <circle cx="20" cy="22" r="12" fill="#4facfe" fill-opacity="0.15" />
    <text x="20" y="26" fill="#4facfe" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" text-anchor="middle">02</text>
    <text x="40" y="26" fill="#60a5fa" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1">ENGINEER</text>
    
    <text x="14" y="60" fill="#ffffff" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="700">Full-Stack Code</text>
    <text x="14" y="80" fill="#94a3b8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11">React 19 &amp; TypeScript</text>
    <text x="14" y="96" fill="#94a3b8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11">Node.js, Express &amp; PHP</text>
    
    <rect x="14" y="110" width="95" height="15" rx="3" fill="#4facfe" fill-opacity="0.12" stroke="#4facfe" stroke-width="0.6" />
    <text x="20" y="121" fill="#60a5fa" font-family="'Courier New', monospace" font-size="9" font-weight="700">CLEAN_LOGIC</text>
  </g>

  <!-- ================= STAGE 3 ================= -->
  <g transform="translate(500, 20)">
    <rect width="200" height="135" rx="10" fill="#081022" stroke="#a855f7" stroke-width="1.2" class="c-pipe-3" />
    <circle cx="20" cy="22" r="12" fill="#a855f7" fill-opacity="0.15" />
    <text x="20" y="26" fill="#a855f7" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" text-anchor="middle">03</text>
    <text x="40" y="26" fill="#c084fc" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1">QA &amp; TEST</text>
    
    <text x="14" y="60" fill="#ffffff" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="700">Zero-Crash Testing</text>
    <text x="14" y="80" fill="#94a3b8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11">Edge-case validation</text>
    <text x="14" y="96" fill="#94a3b8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11">Game &amp; Web QA audits</text>
    
    <rect x="14" y="110" width="90" height="15" rx="3" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-width="0.6" />
    <text x="20" y="121" fill="#c084fc" font-family="'Courier New', monospace" font-size="9" font-weight="700">TEST_DRIVEN</text>
  </g>

  <!-- ================= STAGE 4 ================= -->
  <g transform="translate(740, 20)">
    <rect width="200" height="135" rx="10" fill="#081022" stroke="#00f5d4" stroke-width="1.2" class="c-pipe-4" />
    <circle cx="20" cy="22" r="12" fill="#00f5d4" fill-opacity="0.15" />
    <text x="20" y="26" fill="#00f5d4" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" text-anchor="middle">04</text>
    <text x="40" y="26" fill="#2dd4bf" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1">DEPLOY &amp; SCALE</text>
    
    <text x="14" y="60" fill="#ffffff" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="700">Ship &amp; Elevate</text>
    <text x="14" y="80" fill="#94a3b8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11">High speed &amp; uptime</text>
    <text x="14" y="96" fill="#94a3b8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11">Responsive &amp; live</text>
    
    <rect x="14" y="110" width="85" height="15" rx="3" fill="#00f5d4" fill-opacity="0.12" stroke="#00f5d4" stroke-width="0.6" />
    <text x="20" y="121" fill="#00f5d4" font-family="'Courier New', monospace" font-size="9" font-weight="700">PROD_READY</text>
  </g>
</svg>

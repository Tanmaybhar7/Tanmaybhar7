<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 125" width="100%" height="100%">
  <defs>
    <linearGradient id="quoteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18" />
      <stop offset="100%" stop-color="#0e1529" />
    </linearGradient>

    <linearGradient id="quoteGlowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0" />
      <stop offset="30%" stop-color="#fbbf24" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>

    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseBeacon {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .beacon {
      animation: pulseBeacon 2s ease-in-out infinite;
      transform-origin: 32px 26px;
    }
  </style>

  <!-- Base Card -->
  <rect width="960" height="125" rx="12" fill="url(#quoteBg)" stroke="#1e293b" stroke-width="1.2" />
  
  <!-- Top Accent Beam -->
  <line x1="80" y1="0" x2="880" y2="0" stroke="url(#quoteGlowLine)" stroke-width="2" />

  <!-- Corner Brackets -->
  <path d="M 20 30 L 20 18 L 32 18" fill="none" stroke="#fbbf24" stroke-width="1.8" />
  <path d="M 940 30 L 940 18 L 928 18" fill="none" stroke="#fbbf24" stroke-width="1.8" />
  <path d="M 20 95 L 20 107 L 32 107" fill="none" stroke="#fbbf24" stroke-width="1.8" />
  <path d="M 940 95 L 940 107 L 928 107" fill="none" stroke="#fbbf24" stroke-width="1.8" />

  <!-- Beacon & Header -->
  <g transform="translate(10, 0)">
    <circle cx="32" cy="26" r="4.5" fill="#fbbf24" class="beacon" filter="url(#amberGlow)" />
    <text x="46" y="30" fill="#fbbf24" font-family="'Courier New', monospace" font-size="11.5" font-weight="700" letter-spacing="1.5">DEVELOPER_PHILOSOPHY // LOG_0x7B</text>
  </g>

  <!-- Big Decorative Quote Marks -->
  <text x="45" y="76" fill="#334155" font-family="Georgia, serif" font-size="42" font-weight="900" opacity="0.6">“</text>

  <!-- The Quote Text -->
  <g transform="translate(68, 64)">
    <text x="0" y="0" fill="#f8fafc" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14" font-weight="600" font-style="italic">
      Code is poetry in motion when it works effortlessly,
    </text>
    <text x="0" y="22" fill="#cbd5e1" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="500">
      but true craftsmanship is proven in how thoroughly you test before users ever see a single pixel.
    </text>
  </g>

  <!-- Author Signature -->
  <text x="915" y="102" fill="#64748b" font-family="'Courier New', monospace" font-size="11" font-weight="600" text-anchor="end">
    — Tanmay Bhar
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 135" width="100%" height="100%">
  <defs>
    <linearGradient id="quoteBgAdv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a14" />
      <stop offset="50%" stop-color="#0b1122" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <linearGradient id="quoteGlowLineAdv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0" />
      <stop offset="30%" stop-color="#fbbf24" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>

    <filter id="amberGlowAdv" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseBeaconAdv {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }
    @keyframes eqBar1 { 0%, 100% { height: 6px; y: 18px; } 50% { height: 18px; y: 6px; } }
    @keyframes eqBar2 { 0%, 100% { height: 16px; y: 8px; } 50% { height: 8px; y: 16px; } }
    @keyframes eqBar3 { 0%, 100% { height: 10px; y: 14px; } 50% { height: 22px; y: 2px; } }
    @keyframes eqBar4 { 0%, 100% { height: 20px; y: 4px; } 50% { height: 12px; y: 12px; } }
    @keyframes eqBar5 { 0%, 100% { height: 8px; y: 16px; } 50% { height: 18px; y: 6px; } }

    .beacon-a { animation: pulseBeaconAdv 2s ease-in-out infinite; transform-origin: 32px 26px; }
    .eq-1 { animation: eqBar1 1.2s ease-in-out infinite 0.1s; }
    .eq-2 { animation: eqBar2 1.2s ease-in-out infinite 0.3s; }
    .eq-3 { animation: eqBar3 1.2s ease-in-out infinite 0.5s; }
    .eq-4 { animation: eqBar4 1.2s ease-in-out infinite 0.7s; }
    .eq-5 { animation: eqBar5 1.2s ease-in-out infinite 0.9s; }
  </style>

  <!-- Base Card -->
  <rect width="960" height="135" rx="14" fill="url(#quoteBgAdv)" stroke="#1e293b" stroke-width="1.2" />
  
  <!-- Top Accent Glowing Beam -->
  <line x1="80" y1="0" x2="880" y2="0" stroke="url(#quoteGlowLineAdv)" stroke-width="2" />

  <!-- Corner Tech Brackets -->
  <path d="M 22 32 L 22 18 L 36 18" fill="none" stroke="#fbbf24" stroke-width="2" />
  <path d="M 938 32 L 938 18 L 924 18" fill="none" stroke="#fbbf24" stroke-width="2" />
  <path d="M 22 103 L 22 117 L 36 117" fill="none" stroke="#fbbf24" stroke-width="2" />
  <path d="M 938 103 L 938 117 L 924 117" fill="none" stroke="#fbbf24" stroke-width="2" />

  <!-- Beacon & Header Tag -->
  <g transform="translate(10, 0)">
    <circle cx="32" cy="26" r="4.5" fill="#fbbf24" class="beacon-a" filter="url(#amberGlowAdv)" />
    <text x="46" y="30" fill="#fbbf24" font-family="'Courier New', monospace" font-size="11.5" font-weight="700" letter-spacing="1.5">DEVELOPER_PHILOSOPHY // LOG_0x7B</text>
  </g>

  <!-- Big Decorative Quote Glyph -->
  <text x="44" y="80" fill="#334155" font-family="Georgia, serif" font-size="46" font-weight="900" opacity="0.6">“</text>

  <!-- The Quote Text -->
  <g transform="translate(70, 66)">
    <text x="0" y="0" fill="#f8fafc" font-family="'Segoe UI', -apple-system, sans-serif" font-size="14.5" font-weight="600" font-style="italic">
      Code is poetry in motion when it works effortlessly,
    </text>
    <text x="0" y="24" fill="#cbd5e1" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="500">
      but true craftsmanship is proven in how thoroughly you test before users ever see a single pixel.
    </text>
  </g>

  <!-- Animated Sound/Pulse Equalizer in Bottom-Right -->
  <g transform="translate(730, 85)">
    <rect x="0" width="3" fill="#fbbf24" class="eq-1" rx="1.5" opacity="0.85" />
    <rect x="6" width="3" fill="#f59e0b" class="eq-2" rx="1.5" opacity="0.85" />
    <rect x="12" width="3" fill="#fbbf24" class="eq-3" rx="1.5" opacity="0.85" />
    <rect x="18" width="3" fill="#f59e0b" class="eq-4" rx="1.5" opacity="0.85" />
    <rect x="24" width="3" fill="#fbbf24" class="eq-5" rx="1.5" opacity="0.85" />
  </g>

  <!-- Author Signature -->
  <text x="915" y="108" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11.5" font-weight="700" text-anchor="end">
    — Tanmay Bhar
  </text>
</svg>

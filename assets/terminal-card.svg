<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0a1021" />
    </linearGradient>

    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <filter id="cyanGlowTerm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes termBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes livePulseTerm {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }
    .term-cursor {
      animation: termBlink 1s step-end infinite;
    }
    .term-pulse {
      animation: livePulseTerm 2s ease-in-out infinite;
      transform-origin: 90px 130px;
    }
  </style>

  <!-- Terminal Window Container -->
  <rect width="960" height="280" rx="12" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Terminal Header Bar -->
  <rect width="960" height="38" rx="12" fill="url(#termHeader)" stroke="#1e293b" stroke-width="0.8" />
  <!-- Straighten bottom corners of header -->
  <rect y="26" width="960" height="12" fill="#141e33" />
  <line x1="0" y1="38" x2="960" y2="38" stroke="#334155" stroke-width="0.8" />

  <!-- Window Action Buttons -->
  <circle cx="24" cy="19" r="6" fill="#ef4444" />
  <circle cx="44" cy="19" r="6" fill="#f59e0b" />
  <circle cx="64" cy="19" r="6" fill="#10b981" />

  <!-- Terminal Title -->
  <text x="480" y="24" fill="#94a3b8" font-family="'Courier New', monospace" font-size="12" font-weight="600" text-anchor="middle">
    tanmay@digital-builder: ~ (zsh) — whoami --verbose
  </text>
  <text x="935" y="24" fill="#475569" font-family="'Courier New', monospace" font-size="11" text-anchor="end">UTF-8</text>

  <!-- Terminal Lines -->
  <g transform="translate(28, 66)">
    <!-- Command Invocation -->
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="13.5" font-weight="700">
      <tspan fill="#38bdf8">tanmay@digital-builder</tspan><tspan fill="#94a3b8">:</tspan><tspan fill="#a855f7">~</tspan><tspan fill="#94a3b8">$</tspan> <tspan fill="#f8fafc">whoami --verbose --diagnostics</tspan>
    </text>

    <!-- Line 1: Identity & Bio -->
    <text x="0" y="28" font-family="'Courier New', monospace" font-size="12.5">
      <tspan fill="#22c55e" font-weight="700">[✓] IDENT</tspan>
      <tspan fill="#64748b"> : </tspan>
      <tspan fill="#00f2fe" font-weight="700">Tanmay Bhar</tspan>
      <tspan fill="#94a3b8"> // Full-Stack Developer &amp; QA Enthusiast</tspan>
    </text>

    <!-- Line 2: Mission & Summary -->
    <text x="0" y="52" font-family="'Courier New', monospace" font-size="12.5">
      <tspan fill="#22c55e" font-weight="700">[✓] ABOUT</tspan>
      <tspan fill="#64748b"> : </tspan>
      <tspan fill="#e2e8f0">Engineering scalable full-stack web ecosystems, resilient REST APIs &amp; modern reactive SPAs.</tspan>
    </text>

    <!-- Line 3: Stack -->
    <text x="0" y="76" font-family="'Courier New', monospace" font-size="12.5">
      <tspan fill="#22c55e" font-weight="700">[✓] STACK</tspan>
      <tspan fill="#64748b"> : </tspan>
      <tspan fill="#38bdf8">React 19 • TypeScript • Node.js • Express • PHP 8 PDO • MySQL • Vite • TailwindCSS v4</tspan>
    </text>

    <!-- Line 4: Creed -->
    <text x="0" y="100" font-family="'Courier New', monospace" font-size="12.5">
      <tspan fill="#22c55e" font-weight="700">[✓] CREED</tspan>
      <tspan fill="#64748b"> : </tspan>
      <tspan fill="#fbbf24">"Write clean logic on the backend, effortless beauty on the frontend, eliminate bugs."</tspan>
    </text>

    <!-- Line 5: Domains -->
    <text x="0" y="124" font-family="'Courier New', monospace" font-size="12.5">
      <tspan fill="#22c55e" font-weight="700">[✓] DOMAIN</tspan>
      <tspan fill="#64748b"> : </tspan>
      <tspan fill="#cbd5e1">High-Performance SPAs • Real-Time Web Systems • Database Architecture • QA Audits</tspan>
    </text>

    <!-- Line 6: State -->
    <text x="0" y="148" font-family="'Courier New', monospace" font-size="12.5">
      <tspan fill="#22c55e" font-weight="700">[✓] STATE</tspan>
      <tspan fill="#64748b"> : </tspan>
      <tspan fill="#00f5d4" font-weight="700">ACTIVE // AVAILABLE FOR IMPACTFUL ROLES &amp; COLLABORATIONS 🚀</tspan>
    </text>

    <!-- Line 7: Active prompt with cursor -->
    <text x="0" y="180" font-family="'Courier New', monospace" font-size="13.5" font-weight="700">
      <tspan fill="#38bdf8">tanmay@digital-builder</tspan><tspan fill="#94a3b8">:</tspan><tspan fill="#a855f7">~</tspan><tspan fill="#94a3b8">$</tspan> <tspan fill="#00f2fe">_</tspan>
    </text>
    <rect x="228" y="166" width="8" height="17" fill="#00f2fe" class="term-cursor" />
  </g>
</svg>

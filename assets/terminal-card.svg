<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#0a1021" />
    </linearGradient>

    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes termBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .term-cursor {
      animation: termBlink 1s step-end infinite;
    }
  </style>

  <!-- Terminal Window Container -->
  <rect width="960" height="270" rx="12" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Terminal Header Bar -->
  <rect width="960" height="38" rx="12" fill="url(#termHeader)" stroke="#1e293b" stroke-width="0.8" />
  <!-- Straighten bottom corners of header -->
  <rect y="26" width="960" height="12" fill="#141e33" />
  <line x1="0" y1="38" x2="960" y2="38" stroke="#334155" stroke-width="0.8" />

  <!-- Window Action Buttons -->
  <circle cx="24" cy="19" r="6" fill="#ef4444" />
  <circle cx="44" cy="19" r="6" fill="#f59e0b" />
  <circle cx="64" cy="19" r="6" fill="#10b981" />

  <!-- Terminal Title -->
  <text x="480" y="24" fill="#94a3b8" font-family="'Courier New', monospace" font-size="12" font-weight="600" text-anchor="middle">
    tanmay@digital-builder: ~ (zsh) — 960x270
  </text>
  <text x="935" y="24" fill="#475569" font-family="'Courier New', monospace" font-size="11" text-anchor="end">UTF-8</text>

  <!-- Terminal Lines -->
  <g transform="translate(28, 65)">
    <!-- Command Invocation -->
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="13.5" font-weight="700">
      <tspan fill="#38bdf8">tanmay@builder</tspan><tspan fill="#94a3b8">:</tspan><tspan fill="#a855f7">~</tspan><tspan fill="#94a3b8">$</tspan> <tspan fill="#f1f5f9">tanmay --status --diagnostics</tspan>
    </text>

    <!-- Line 1: Identity -->
    <text x="0" y="28" font-family="'Courier New', monospace" font-size="12.5">
      <tspan fill="#22c55e" font-weight="700">[✓] IDENT</tspan>
      <tspan fill="#64748b"> : </tspan>
      <tspan fill="#00f2fe" font-weight="700">Tanmay Bhar</tspan>
      <tspan fill="#94a3b8"> // Full-Stack Web Developer &amp; QA Engineer</tspan>
    </text>

    <!-- Line 2: Stack -->
    <text x="0" y="52" font-family="'Courier New', monospace" font-size="12.5">
      <tspan fill="#22c55e" font-weight="700">[✓] STACK</tspan>
      <tspan fill="#64748b"> : </tspan>
      <tspan fill="#e2e8f0">React 19, TypeScript, Node.js, Express, PHP 8, MySQL, Vite, TailwindCSS</tspan>
    </text>

    <!-- Line 3: Focus -->
    <text x="0" y="76" font-family="'Courier New', monospace" font-size="12.5">
      <tspan fill="#22c55e" font-weight="700">[✓] CREED</tspan>
      <tspan fill="#64748b"> : </tspan>
      <tspan fill="#fbbf24">"Architect scalable backends, design effortless frontends, eliminate bugs."</tspan>
    </text>

    <!-- Line 4: Domains -->
    <text x="0" y="100" font-family="'Courier New', monospace" font-size="12.5">
      <tspan fill="#22c55e" font-weight="700">[✓] FOCUS</tspan>
      <tspan fill="#64748b"> : </tspan>
      <tspan fill="#cbd5e1">High-Performance SPAs • Real-time Web Systems • Database Architecture • QA Audits</tspan>
    </text>

    <!-- Line 5: Live Status -->
    <text x="0" y="124" font-family="'Courier New', monospace" font-size="12.5">
      <tspan fill="#22c55e" font-weight="700">[✓] STATE</tspan>
      <tspan fill="#64748b"> : </tspan>
      <tspan fill="#00f5d4" font-weight="700">ACTIVE // READY TO BUILD INNOVATIVE SOFTWARE 🚀</tspan>
    </text>

    <!-- Line 6: Active prompt with cursor -->
    <text x="0" y="160" font-family="'Courier New', monospace" font-size="13.5" font-weight="700">
      <tspan fill="#38bdf8">tanmay@builder</tspan><tspan fill="#94a3b8">:</tspan><tspan fill="#a855f7">~</tspan><tspan fill="#94a3b8">$</tspan> <tspan fill="#00f2fe">_</tspan>
    </text>
    <rect x="156" y="146" width="8" height="17" fill="#00f2fe" class="term-cursor" />
  </g>
</svg>

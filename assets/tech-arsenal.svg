<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <linearGradient id="techCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#0b1326" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlowTech" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseT1 { 0%, 100% { stroke: #00f2fe; stroke-opacity: 0.8; } 50% { stroke: #38bdf8; stroke-opacity: 0.3; } }
    @keyframes pulseT2 { 0%, 100% { stroke: #c084fc; stroke-opacity: 0.8; } 50% { stroke: #a855f7; stroke-opacity: 0.3; } }
    @keyframes pulseT3 { 0%, 100% { stroke: #10b981; stroke-opacity: 0.8; } 50% { stroke: #34d399; stroke-opacity: 0.3; } }
    @keyframes pulseT4 { 0%, 100% { stroke: #f43f5e; stroke-opacity: 0.8; } 50% { stroke: #fb7185; stroke-opacity: 0.3; } }
    
    @keyframes floatTechBadge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-1.5px); }
    }
    .card-t1 { animation: pulseT1 3.5s ease-in-out infinite 0s; }
    .card-t2 { animation: pulseT2 3.5s ease-in-out infinite 0.9s; }
    .card-t3 { animation: pulseT3 3.5s ease-in-out infinite 1.8s; }
    .card-t4 { animation: pulseT4 3.5s ease-in-out infinite 2.7s; }
    .badge-f { animation: floatTechBadge 3s ease-in-out infinite; }
  </style>

  <!-- ================= QUADRANT 1: CORE LANGUAGES ================= -->
  <g transform="translate(10, 10)">
    <rect width="460" height="145" rx="10" fill="url(#techCardBg)" stroke="#00f2fe" stroke-width="1.2" class="card-t1" />
    
    <!-- Title -->
    <g transform="translate(18, 16)">
      <circle cx="10" cy="10" r="10" fill="#00f2fe" fill-opacity="0.15" />
      <text x="10" y="14" font-size="12" text-anchor="middle">🧠</text>
      <text x="28" y="14" fill="#00f2fe" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">CORE LANGUAGES &amp; LOGIC</text>
    </g>

    <!-- Items -->
    <g transform="translate(18, 48)">
      <!-- Line 1 -->
      <rect x="0" y="0" width="76" height="18" rx="4" fill="#0f1f38" stroke="#00f2fe" stroke-width="0.6" />
      <text x="38" y="12.5" fill="#38bdf8" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">C &amp; Python</text>
      <text x="84" y="13" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Low-level memory &amp; automation scripting</text>

      <!-- Line 2 -->
      <rect x="0" y="24" width="74" height="18" rx="4" fill="#0f1f38" stroke="#00f2fe" stroke-width="0.6" />
      <text x="37" y="36.5" fill="#38bdf8" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">JavaScript</text>
      <text x="82" y="37" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— ES6+, asynchronous DOM &amp; web logic</text>

      <!-- Line 3 -->
      <rect x="0" y="48" width="76" height="18" rx="4" fill="#0f1f38" stroke="#00f2fe" stroke-width="0.6" />
      <text x="38" y="60.5" fill="#38bdf8" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">TypeScript</text>
      <text x="84" y="61" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Strict typing &amp; scalable code architectures</text>

      <!-- Line 4 -->
      <rect x="0" y="72" width="82" height="18" rx="4" fill="#0f1f38" stroke="#00f2fe" stroke-width="0.6" />
      <text x="41" y="84.5" fill="#38bdf8" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">HTML5 &amp; CSS3</text>
      <text x="90" y="85" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Modern semantic layout &amp; responsive UI</text>
    </g>
  </g>

  <!-- ================= QUADRANT 2: FRONTEND & MOBILE ================= -->
  <g transform="translate(490, 10)">
    <rect width="460" height="145" rx="10" fill="url(#techCardBg)" stroke="#c084fc" stroke-width="1.2" class="card-t2" />
    
    <!-- Title -->
    <g transform="translate(18, 16)">
      <circle cx="10" cy="10" r="10" fill="#a855f7" fill-opacity="0.15" />
      <text x="10" y="14" font-size="12" text-anchor="middle">⚡</text>
      <text x="28" y="14" fill="#c084fc" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">FRONTEND &amp; MOBILE APPS</text>
    </g>

    <!-- Items -->
    <g transform="translate(18, 48)">
      <!-- Line 1 -->
      <rect x="0" y="0" width="85" height="18" rx="4" fill="#201138" stroke="#a855f7" stroke-width="0.6" />
      <text x="42.5" y="12.5" fill="#d8b4fe" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">React 19 / JS</text>
      <text x="93" y="13" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— SPAs, Hooks, components &amp; reactivity</text>

      <!-- Line 2 -->
      <rect x="0" y="24" width="98" height="18" rx="4" fill="#201138" stroke="#a855f7" stroke-width="0.6" />
      <text x="49" y="36.5" fill="#d8b4fe" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">Android Studio</text>
      <text x="106" y="37" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Native Android app dev &amp; testing</text>

      <!-- Line 3 -->
      <rect x="0" y="48" width="68" height="18" rx="4" fill="#201138" stroke="#a855f7" stroke-width="0.6" />
      <text x="34" y="60.5" fill="#d8b4fe" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">Mobile UI</text>
      <text x="76" y="61" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Mobile layouts, gestures &amp; views</text>

      <!-- Line 4 -->
      <rect x="0" y="72" width="70" height="18" rx="4" fill="#201138" stroke="#a855f7" stroke-width="0.6" />
      <text x="35" y="84.5" fill="#d8b4fe" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">Web Apps</text>
      <text x="78" y="85" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Cross-device, fluid user experiences</text>
    </g>
  </g>

  <!-- ================= QUADRANT 3: BACKEND & REST APIS ================= -->
  <g transform="translate(10, 165)">
    <rect width="460" height="145" rx="10" fill="url(#techCardBg)" stroke="#10b981" stroke-width="1.2" class="card-t3" />
    
    <!-- Title -->
    <g transform="translate(18, 16)">
      <circle cx="10" cy="10" r="10" fill="#10b981" fill-opacity="0.15" />
      <text x="10" y="14" font-size="12" text-anchor="middle">🚀</text>
      <text x="28" y="14" fill="#34d399" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">BACKEND &amp; REST APIS</text>
    </g>

    <!-- Items -->
    <g transform="translate(18, 48)">
      <!-- Line 1 -->
      <rect x="0" y="0" width="60" height="18" rx="4" fill="#0d261e" stroke="#10b981" stroke-width="0.6" />
      <text x="30" y="12.5" fill="#6ee7b7" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">Node.js</text>
      <text x="68" y="13" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Server-side JavaScript runtime environment</text>

      <!-- Line 2 -->
      <rect x="0" y="24" width="45" height="18" rx="4" fill="#0d261e" stroke="#10b981" stroke-width="0.6" />
      <text x="22.5" y="36.5" fill="#6ee7b7" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">PHP</text>
      <text x="53" y="37" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Dynamic server scripting &amp; API services</text>

      <!-- Line 3 -->
      <rect x="0" y="48" width="70" height="18" rx="4" fill="#0d261e" stroke="#10b981" stroke-width="0.6" />
      <text x="35" y="60.5" fill="#6ee7b7" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">REST APIs</text>
      <text x="78" y="61" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— JSON endpoints, HTTP methods &amp; CRUD</text>

      <!-- Line 4 -->
      <rect x="0" y="72" width="82" height="18" rx="4" fill="#0d261e" stroke="#10b981" stroke-width="0.6" />
      <text x="41" y="84.5" fill="#6ee7b7" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">Git &amp; GitHub</text>
      <text x="90" y="85" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Version control, repos &amp; collaboration</text>
    </g>
  </g>

  <!-- ================= QUADRANT 4: DATABASE & UI/UX ================= -->
  <g transform="translate(490, 165)">
    <rect width="460" height="145" rx="10" fill="url(#techCardBg)" stroke="#f43f5e" stroke-width="1.2" class="card-t4" />
    
    <!-- Title -->
    <g transform="translate(18, 16)">
      <circle cx="10" cy="10" r="10" fill="#f43f5e" fill-opacity="0.15" />
      <text x="10" y="14" font-size="12" text-anchor="middle">🗄️</text>
      <text x="28" y="14" fill="#fb7185" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">DATABASE &amp; UI/UX DESIGN</text>
    </g>

    <!-- Items -->
    <g transform="translate(18, 48)">
      <!-- Line 1 -->
      <rect x="0" y="0" width="55" height="18" rx="4" fill="#2d0f17" stroke="#f43f5e" stroke-width="0.6" />
      <text x="27.5" y="12.5" fill="#fda4af" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">MySQL</text>
      <text x="63" y="13" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Relational schema modeling &amp; SQL queries</text>

      <!-- Line 2 -->
      <rect x="0" y="24" width="50" height="18" rx="4" fill="#2d0f17" stroke="#f43f5e" stroke-width="0.6" />
      <text x="25" y="36.5" fill="#fda4af" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">DBMS</text>
      <text x="58" y="37" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Database management, relations &amp; indexing</text>

      <!-- Line 3 -->
      <rect x="0" y="48" width="50" height="18" rx="4" fill="#2d0f17" stroke="#f43f5e" stroke-width="0.6" />
      <text x="25" y="60.5" fill="#fda4af" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">Figma</text>
      <text x="58" y="61" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— High-fidelity UI prototyping &amp; wireframes</text>

      <!-- Line 4 -->
      <rect x="0" y="72" width="52" height="18" rx="4" fill="#2d0f17" stroke="#f43f5e" stroke-width="0.6" />
      <text x="26" y="84.5" fill="#fda4af" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">Stitch</text>
      <text x="60" y="85" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— UI/UX system design &amp; layout workflows</text>
    </g>
  </g>
</svg>

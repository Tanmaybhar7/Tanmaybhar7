<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <linearGradient id="techCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#0b1326" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlowTech" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseT1 { 0%, 100% { stroke: #00f2fe; stroke-opacity: 0.8; } 50% { stroke: #38bdf8; stroke-opacity: 0.3; } }
    @keyframes pulseT2 { 0%, 100% { stroke: #c084fc; stroke-opacity: 0.8; } 50% { stroke: #a855f7; stroke-opacity: 0.3; } }
    @keyframes pulseT3 { 0%, 100% { stroke: #10b981; stroke-opacity: 0.8; } 50% { stroke: #34d399; stroke-opacity: 0.3; } }
    @keyframes pulseT4 { 0%, 100% { stroke: #f43f5e; stroke-opacity: 0.8; } 50% { stroke: #fb7185; stroke-opacity: 0.3; } }
    
    @keyframes floatTechBadge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-1.5px); }
    }
    .card-t1 { animation: pulseT1 3.5s ease-in-out infinite 0s; }
    .card-t2 { animation: pulseT2 3.5s ease-in-out infinite 0.9s; }
    .card-t3 { animation: pulseT3 3.5s ease-in-out infinite 1.8s; }
    .card-t4 { animation: pulseT4 3.5s ease-in-out infinite 2.7s; }
    .badge-f { animation: floatTechBadge 3s ease-in-out infinite; }
  </style>

  <!-- ================= QUADRANT 1: CORE LANGUAGES ================= -->
  <g transform="translate(10, 10)">
    <rect width="460" height="145" rx="10" fill="url(#techCardBg)" stroke="#00f2fe" stroke-width="1.2" class="card-t1" />
    
    <!-- Title -->
    <g transform="translate(18, 16)">
      <circle cx="10" cy="10" r="10" fill="#00f2fe" fill-opacity="0.15" />
      <text x="10" y="14" font-size="12" text-anchor="middle">🧠</text>
      <text x="28" y="14" fill="#00f2fe" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">CORE LANGUAGES &amp; FUNDAMENTALS</text>
    </g>

    <!-- Items -->
    <g transform="translate(18, 48)">
      <!-- Line 1 -->
      <rect x="0" y="0" width="76" height="18" rx="4" fill="#0f1f38" stroke="#00f2fe" stroke-width="0.6" />
      <text x="38" y="12.5" fill="#38bdf8" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">TypeScript</text>
      <text x="84" y="13" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Strict typing &amp; robust interfaces</text>

      <!-- Line 2 -->
      <rect x="0" y="24" width="70" height="18" rx="4" fill="#0f1f38" stroke="#00f2fe" stroke-width="0.6" />
      <text x="35" y="36.5" fill="#38bdf8" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">JS (ES6+)</text>
      <text x="78" y="37" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Async/Await, Modern DOM &amp; Logic</text>

      <!-- Line 3 -->
      <rect x="0" y="48" width="55" height="18" rx="4" fill="#0f1f38" stroke="#00f2fe" stroke-width="0.6" />
      <text x="27.5" y="60.5" fill="#38bdf8" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">PHP 8</text>
      <text x="63" y="61" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— REST APIs &amp; PDO prepared statements</text>

      <!-- Line 4 -->
      <rect x="0" y="72" width="76" height="18" rx="4" fill="#0f1f38" stroke="#00f2fe" stroke-width="0.6" />
      <text x="38" y="84.5" fill="#38bdf8" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">HTML &amp; CSS</text>
      <text x="84" y="85" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Semantic layout &amp; responsive UI</text>
    </g>
  </g>

  <!-- ================= QUADRANT 2: FRONTEND & UI ================= -->
  <g transform="translate(490, 10)">
    <rect width="460" height="145" rx="10" fill="url(#techCardBg)" stroke="#c084fc" stroke-width="1.2" class="card-t2" />
    
    <!-- Title -->
    <g transform="translate(18, 16)">
      <circle cx="10" cy="10" r="10" fill="#a855f7" fill-opacity="0.15" />
      <text x="10" y="14" font-size="12" text-anchor="middle">⚡</text>
      <text x="28" y="14" fill="#c084fc" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">FRONTEND &amp; UI ENGINEERING</text>
    </g>

    <!-- Items -->
    <g transform="translate(18, 48)">
      <!-- Line 1 -->
      <rect x="0" y="0" width="70" height="18" rx="4" fill="#201138" stroke="#a855f7" stroke-width="0.6" />
      <text x="35" y="12.5" fill="#d8b4fe" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">React 19</text>
      <text x="78" y="13" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— SPAs, Hooks &amp; component state</text>

      <!-- Line 2 -->
      <rect x="0" y="24" width="45" height="18" rx="4" fill="#201138" stroke="#a855f7" stroke-width="0.6" />
      <text x="22.5" y="36.5" fill="#d8b4fe" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">Vite</text>
      <text x="53" y="37" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Lightning-fast build tooling &amp; HMR</text>

      <!-- Line 3 -->
      <rect x="0" y="48" width="82" height="18" rx="4" fill="#201138" stroke="#a855f7" stroke-width="0.6" />
      <text x="41" y="60.5" fill="#d8b4fe" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">Tailwind v4</text>
      <text x="90" y="61" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Dynamic utilities &amp; Bootstrap 5</text>

      <!-- Line 4 -->
      <rect x="0" y="72" width="78" height="18" rx="4" fill="#201138" stroke="#a855f7" stroke-width="0.6" />
      <text x="39" y="84.5" fill="#d8b4fe" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">UI &amp; Charts</text>
      <text x="86" y="85" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Framer Motion, Leaflet &amp; Recharts</text>
    </g>
  </g>

  <!-- ================= QUADRANT 3: BACKEND & REAL-TIME ================= -->
  <g transform="translate(10, 165)">
    <rect width="460" height="145" rx="10" fill="url(#techCardBg)" stroke="#10b981" stroke-width="1.2" class="card-t3" />
    
    <!-- Title -->
    <g transform="translate(18, 16)">
      <circle cx="10" cy="10" r="10" fill="#10b981" fill-opacity="0.15" />
      <text x="10" y="14" font-size="12" text-anchor="middle">🚀</text>
      <text x="28" y="14" fill="#34d399" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">BACKEND &amp; REAL-TIME SYSTEMS</text>
    </g>

    <!-- Items -->
    <g transform="translate(18, 48)">
      <!-- Line 1 -->
      <rect x="0" y="0" width="105" height="18" rx="4" fill="#0d261e" stroke="#10b981" stroke-width="0.6" />
      <text x="52.5" y="12.5" fill="#6ee7b7" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">Node &amp; Express</text>
      <text x="113" y="13" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— High-throughput server architectures</text>

      <!-- Line 2 -->
      <rect x="0" y="24" width="70" height="18" rx="4" fill="#0d261e" stroke="#10b981" stroke-width="0.6" />
      <text x="35" y="36.5" fill="#6ee7b7" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">Socket.io</text>
      <text x="78" y="37" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Bidirectional live event streaming</text>

      <!-- Line 3 -->
      <rect x="0" y="48" width="70" height="18" rx="4" fill="#0d261e" stroke="#10b981" stroke-width="0.6" />
      <text x="35" y="60.5" fill="#6ee7b7" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">REST APIs</text>
      <text x="78" y="61" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Strict HTTP methods &amp; JSON contracts</text>

      <!-- Line 4 -->
      <rect x="0" y="72" width="78" height="18" rx="4" fill="#0d261e" stroke="#10b981" stroke-width="0.6" />
      <text x="39" y="84.5" fill="#6ee7b7" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">Middleware</text>
      <text x="86" y="85" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— CORS security, Dotenv &amp; validation</text>
    </g>
  </g>

  <!-- ================= QUADRANT 4: DATABASE & QUALITY ================= -->
  <g transform="translate(490, 165)">
    <rect width="460" height="145" rx="10" fill="url(#techCardBg)" stroke="#f43f5e" stroke-width="1.2" class="card-t4" />
    
    <!-- Title -->
    <g transform="translate(18, 16)">
      <circle cx="10" cy="10" r="10" fill="#f43f5e" fill-opacity="0.15" />
      <text x="10" y="14" font-size="12" text-anchor="middle">🗄️</text>
      <text x="28" y="14" fill="#fb7185" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">DATABASE &amp; QUALITY ASSURANCE</text>
    </g>

    <!-- Items -->
    <g transform="translate(18, 48)">
      <!-- Line 1 -->
      <rect x="0" y="0" width="98" height="18" rx="4" fill="#2d0f17" stroke="#f43f5e" stroke-width="0.6" />
      <text x="49" y="12.5" fill="#fda4af" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">MySQL / MySQL2</text>
      <text x="106" y="13" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Schema design &amp; query optimization</text>

      <!-- Line 2 -->
      <rect x="0" y="24" width="68" height="18" rx="4" fill="#2d0f17" stroke="#f43f5e" stroke-width="0.6" />
      <text x="34" y="36.5" fill="#fda4af" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">Supabase</text>
      <text x="76" y="37" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Cloud database &amp; Auth integration</text>

      <!-- Line 3 -->
      <rect x="0" y="48" width="58" height="18" rx="4" fill="#2d0f17" stroke="#f43f5e" stroke-width="0.6" />
      <text x="29" y="60.5" fill="#fda4af" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">Postman</text>
      <text x="66" y="61" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Automated API endpoint &amp; schema tests</text>

      <!-- Line 4 -->
      <rect x="0" y="72" width="70" height="18" rx="4" fill="#2d0f17" stroke="#f43f5e" stroke-width="0.6" />
      <text x="35" y="84.5" fill="#fda4af" font-family="'Courier New', monospace" font-size="9.5" font-weight="700" text-anchor="middle">QA Audits</text>
      <text x="78" y="85" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11">— Game QA &amp; rigorous edge-case testing</text>
    </g>
  </g>
</svg>

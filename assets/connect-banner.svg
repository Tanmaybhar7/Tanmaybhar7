<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 115" width="100%" height="100%">
  <defs>
    <linearGradient id="connBgAdv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a16" />
      <stop offset="50%" stop-color="#091122" />
      <stop offset="100%" stop-color="#060b18" />
    </linearGradient>

    <linearGradient id="radarSweepAdv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#00f5d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </linearGradient>

    <filter id="connGlowAdv" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes radarMove {
      0% { transform: translateX(-350px); }
      100% { transform: translateX(960px); }
    }
    @keyframes pulseSignalWave {
      0% { r: 5px; opacity: 1; }
      100% { r: 18px; opacity: 0; }
    }
    @keyframes liveDotPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .radar-sweep-bar { animation: radarMove 4.5s linear infinite; }
    .signal-wave { animation: pulseSignalWave 2s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    .pulse-dot-c { animation: liveDotPulse 2s ease-in-out infinite; transform-origin: 36px 30px; }
  </style>

  <!-- Base Container -->
  <rect width="960" height="115" rx="14" fill="url(#connBgAdv)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Moving Radar Laser Beam -->
  <g class="radar-sweep-bar">
    <rect x="0" y="0" width="220" height="115" fill="url(#radarSweepAdv)" opacity="0.12" />
  </g>

  <!-- Broadcasting Animated Signal Rings -->
  <circle cx="36" cy="30" r="12" fill="none" stroke="#00f5d4" stroke-width="1" class="signal-wave" />
  <circle cx="36" cy="30" r="5" fill="#00f5d4" class="pulse-dot-c" filter="url(#connGlowAdv)" />
  
  <!-- Text Content -->
  <text x="56" y="34" fill="#00f5d4" font-family="'Courier New', monospace" font-size="12" font-weight="700" letter-spacing="2">
    TRANSMISSION_PROTOCOL // OPEN_FOR_OPPORTUNITIES
  </text>
  <text x="36" y="66" fill="#ffffff" font-family="'Segoe UI', -apple-system, sans-serif" font-size="16" font-weight="700">
    Let's build something extraordinary together
  </text>
  <text x="36" y="88" fill="#94a3b8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12.5" font-weight="500">
    Available for Full-Stack Engineering roles, React 19 Frontend development, and QA architectures.
  </text>

  <!-- Right Side Cyber Badge -->
  <g transform="translate(745, 38)">
    <rect width="180" height="40" rx="8" fill="#08142a" stroke="#00f2fe" stroke-width="1" />
    <circle cx="20" cy="20" r="4" fill="#00f2fe" class="pulse-dot-c" />
    <text x="98" y="25" fill="#38bdf8" font-family="'Courier New', monospace" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">
      ⚡ DISPATCH_READY
    </text>
  </g>
</svg>

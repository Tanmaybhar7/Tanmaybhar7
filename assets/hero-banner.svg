<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="heroBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="40%" stop-color="#080e1e" />
      <stop offset="80%" stop-color="#0d152c" />
      <stop offset="100%" stop-color="#060914" />
    </linearGradient>

    <!-- Animated Neon Title Gradient -->
    <linearGradient id="heroTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#38bdf8;#a855f7;#00f5d4;#00f2fe" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#00f5d4;#00f2fe;#38bdf8" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#00f5d4;#00f2fe;#38bdf8;#a855f7" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00f5d4">
        <animate attributeName="stop-color" values="#00f5d4;#00f2fe;#38bdf8;#a855f7;#00f5d4" dur="9s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Scanning Laser Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="20%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#00f5d4" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="ultraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="matrixGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.35" />
      <circle cx="32" cy="0" r="1.2" fill="#00f2fe" fill-opacity="0.4" />
      <circle cx="0" cy="32" r="1" fill="#a855f7" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes laserSweep {
      0% { transform: translateY(-50px); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translateY(380px); opacity: 0; }
    }
    @keyframes rotateRadar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateRadarRev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulseLiveDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }
    @keyframes blinkCursor {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-8px) translateX(4px); }
    }
    @keyframes floatChipX {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3.5px); }
    }

    .laser-line { animation: laserSweep 6s ease-in-out infinite; }
    .radar-ring-1 { animation: rotateRadar 18s linear infinite; transform-origin: 800px 175px; }
    .radar-ring-2 { animation: rotateRadarRev 12s linear infinite; transform-origin: 800px 175px; }
    .status-pulse { animation: pulseLiveDot 2s ease-in-out infinite; transform-origin: 58px 38px; }
    .type-cursor { animation: blinkCursor 1s step-end infinite; }
    .p-float-1 { animation: floatParticle 5s ease-in-out infinite 0s; }
    .p-float-2 { animation: floatParticle 6s ease-in-out infinite 1.5s; }
    .p-float-3 { animation: floatParticle 7s ease-in-out infinite 3s; }
    .c-float-1 { animation: floatChipX 4s ease-in-out infinite 0.2s; }
    .c-float-2 { animation: floatChipX 4s ease-in-out infinite 0.8s; }
    .c-float-3 { animation: floatChipX 4s ease-in-out infinite 1.4s; }
    .c-float-4 { animation: floatChipX 4s ease-in-out infinite 2.0s; }
  </style>

  <!-- Base Canvas -->
  <rect width="960" height="360" rx="16" fill="url(#heroBgGrad)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="960" height="360" rx="16" fill="url(#matrixGrid)" />

  <!-- Ambient Holographic Glow Flares -->
  <circle cx="160" cy="100" r="180" fill="#00f2fe" fill-opacity="0.08" filter="url(#ultraGlow)" />
  <circle cx="820" cy="220" r="200" fill="#a855f7" fill-opacity="0.09" filter="url(#ultraGlow)" />
  <circle cx="500" cy="320" r="140" fill="#00f5d4" fill-opacity="0.05" filter="url(#ultraGlow)" />

  <!-- Floating Star / Cyber Particles -->
  <circle cx="280" cy="65" r="1.8" fill="#00f2fe" class="p-float-1" opacity="0.8" />
  <circle cx="620" cy="45" r="2.2" fill="#00f5d4" class="p-float-2" opacity="0.8" />
  <circle cx="440" cy="140" r="1.5" fill="#a855f7" class="p-float-3" opacity="0.8" />
  <circle cx="120" cy="270" r="2" fill="#38bdf8" class="p-float-1" opacity="0.7" />
  <circle cx="720" cy="310" r="1.8" fill="#f43f5e" class="p-float-2" opacity="0.6" />

  <!-- Scanning Laser Beam -->
  <g class="laser-line">
    <line x1="20" y1="0" x2="940" y2="0" stroke="url(#laserGrad)" stroke-width="2" filter="url(#subtleGlow)" />
  </g>

  <!-- HUD Corner Tech Brackets -->
  <path d="M 25 55 L 25 25 L 55 25" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 935 55 L 935 25 L 905 25" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 25 305 L 25 335 L 55 335" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 935 305 L 935 335 L 905 335" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" />

  <!-- Crosshair Accents -->
  <g stroke="#334155" stroke-width="1">
    <line x1="480" y1="15" x2="480" y2="25" /><line x1="475" y1="20" x2="485" y2="20" />
    <line x1="480" y1="335" x2="480" y2="345" /><line x1="475" y1="340" x2="485" y2="340" />
  </g>

  <!-- Top Status Telemetry Ribbon -->
  <g transform="translate(45, 24)">
    <!-- Online Pill -->
    <rect width="365" height="28" rx="6" fill="#081020" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.8" />
    <circle cx="16" cy="14" r="5" fill="#10b981" class="status-pulse" filter="url(#subtleGlow)" />
    <text x="28" y="18" fill="#10b981" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="1">SYSTEM: ONLINE</text>
    <text x="140" y="18" fill="#334155">|</text>
    <text x="152" y="18" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">FULL-STACK &amp; QA ENGINEER</text>

    <!-- Hireable Pill -->
    <g transform="translate(690, 0)">
      <rect width="180" height="28" rx="6" fill="#081020" stroke="#00f5d4" stroke-width="0.8" stroke-opacity="0.8" />
      <circle cx="16" cy="14" r="4" fill="#00f5d4" class="status-pulse" />
      <text x="28" y="18" fill="#00f5d4" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">OPEN FOR ROLES</text>
      <text x="135" y="18" fill="#64748b" font-family="'Courier New', monospace" font-size="9.5">v2.6_PROD</text>
    </g>
  </g>

  <!-- Rotating Holographic Radar Dial in Background (Right) -->
  <g transform="translate(0, 0)">
    <!-- Outer dashed ring -->
    <circle cx="800" cy="180" r="115" fill="none" stroke="#1e293b" stroke-width="1.2" stroke-dasharray="6,8" class="radar-ring-1" opacity="0.6" />
    <!-- Inner cyan arc -->
    <circle cx="800" cy="180" r="85" fill="none" stroke="#00f2fe" stroke-width="1" stroke-dasharray="35,140" class="radar-ring-2" opacity="0.7" />
    <!-- Crosshairs -->
    <line x1="800" y1="70" x2="800" y2="290" stroke="#1e293b" stroke-width="0.7" opacity="0.5" />
    <line x1="690" y1="180" x2="910" y2="180" stroke="#1e293b" stroke-width="0.7" opacity="0.5" />
  </g>

  <!-- Main Left Content Block -->
  <g transform="translate(45, 140)">
    <!-- Protocol Badge -->
    <rect x="0" y="-36" width="310" height="20" rx="4" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-width="0.7" />
    <text x="10" y="-22" fill="#00f2fe" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="2.5">
      INITIALIZING DIGITAL BUILDER INTERFACE //
    </text>

    <!-- Giant Illuminated Hero Title -->
    <text x="0" y="32" fill="url(#heroTitleGrad)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="900" letter-spacing="1.5" filter="url(#subtleGlow)">
      TANMAY BHAR
    </text>

    <!-- Subtitle Role -->
    <text x="2" y="68" fill="#f8fafc" font-family="'Segoe UI', -apple-system, sans-serif" font-size="18.5" font-weight="700" letter-spacing="0.8">
      FULL-STACK ARCHITECT <tspan fill="#38bdf8">//</tspan> REACT 19 <tspan fill="#a855f7">//</tspan> NODE.JS <tspan fill="#00f5d4">//</tspan> QA ENTHUSIAST
    </text>

    <!-- Terminal Command Mission Bar -->
    <g transform="translate(0, 106)">
      <rect x="0" y="-20" width="580" height="30" rx="6" fill="#060e1d" stroke="#1e293b" stroke-width="1" />
      <circle cx="14" cy="-5" r="3.5" fill="#38bdf8" />
      <text x="28" y="-1" fill="#38bdf8" font-family="'Courier New', monospace" font-size="12" font-weight="700">&gt;</text>
      <text x="44" y="-1" fill="#e2e8f0" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="500">
        Turning complex logic into fast, scalable &amp; bulletproof web ecosystems
      </text>
      <rect x="528" y="-14" width="8" height="18" fill="#00f2fe" class="type-cursor" />
    </g>
  </g>

  <!-- Right Side Interactive Telemetry Card -->
  <g transform="translate(680, 95)">
    <!-- Container Base -->
    <rect width="235" height="235" rx="14" fill="#070d1b" fill-opacity="0.95" stroke="#1e293b" stroke-width="1.2" />
    
    <!-- Top Terminal Bar -->
    <rect width="235" height="32" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
    <circle cx="16" cy="16" r="4" fill="#ef4444" />
    <circle cx="28" cy="16" r="4" fill="#eab308" />
    <circle cx="40" cy="16" r="4" fill="#22c55e" />
    <text x="56" y="20" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10.5" font-weight="700">active_stack.json</text>

    <!-- Floating Technology Rows -->
    <!-- Row 1 -->
    <g transform="translate(14, 46)">
      <g class="c-float-1">
        <rect width="98" height="28" rx="6" fill="#0b172a" stroke="#00f2fe" stroke-width="0.8" />
        <text x="10" y="18" fill="#00f2fe" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700">⚡ React 19</text>
      </g>
    </g>
    <g transform="translate(122, 46)">
      <g class="c-float-2">
        <rect width="98" height="28" rx="6" fill="#0b172a" stroke="#38bdf8" stroke-width="0.8" />
        <text x="10" y="18" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700">🧠 TypeScript</text>
      </g>
    </g>

    <!-- Row 2 -->
    <g transform="translate(14, 84)">
      <g class="c-float-3">
        <rect width="98" height="28" rx="6" fill="#0b172a" stroke="#22c55e" stroke-width="0.8" />
        <text x="10" y="18" fill="#22c55e" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700">🚀 Node.js</text>
      </g>
    </g>
    <g transform="translate(122, 84)">
      <g class="c-float-4">
        <rect width="98" height="28" rx="6" fill="#0b172a" stroke="#c084fc" stroke-width="0.8" />
        <text x="10" y="18" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700">🐘 PHP 8 PDO</text>
      </g>
    </g>

    <!-- Row 3 -->
    <g transform="translate(14, 122)">
      <g class="c-float-1">
        <rect width="98" height="28" rx="6" fill="#0b172a" stroke="#f59e0b" stroke-width="0.8" />
        <text x="10" y="18" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700">🗄️ MySQL2</text>
      </g>
    </g>
    <g transform="translate(122, 122)">
      <g class="c-float-2">
        <rect width="98" height="28" rx="6" fill="#0b172a" stroke="#ec4899" stroke-width="0.8" />
        <text x="10" y="18" fill="#f472b6" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700">🎯 QA Audits</text>
      </g>
    </g>

    <!-- Row 4 -->
    <g transform="translate(14, 160)">
      <g class="c-float-3">
        <rect width="98" height="28" rx="6" fill="#0b172a" stroke="#00f5d4" stroke-width="0.8" />
        <text x="10" y="18" fill="#00f5d4" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700">⚡ Tailwind v4</text>
      </g>
    </g>
    <g transform="translate(122, 160)">
      <g class="c-float-4">
        <rect width="98" height="28" rx="6" fill="#0b172a" stroke="#60a5fa" stroke-width="0.8" />
        <text x="10" y="18" fill="#93c5fd" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="700">🔄 Socket.io</text>
      </g>
    </g>

    <!-- Bottom Status Matrix -->
    <g transform="translate(14, 198)">
      <rect width="206" height="24" rx="5" fill="#030712" stroke="#1e293b" stroke-width="0.8" />
      <circle cx="12" cy="12" r="3.5" fill="#10b981" class="status-pulse" />
      <text x="24" y="16" fill="#94a3b8" font-family="'Courier New', monospace" font-size="10" font-weight="700">STATUS: READY TO SHIP 🚀</text>
    </g>
  </g>

  <!-- Bottom Accent Laser Line -->
  <line x1="45" y1="345" x2="915" y2="345" stroke="url(#laserGrad)" stroke-width="1.8" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#080c17" />
    </linearGradient>

    <linearGradient id="cyberText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#4facfe;#9d4edd;#00f2fe" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#4facfe">
        <animate attributeName="stop-color" values="#4facfe;#9d4edd;#00f2fe;#4facfe" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00f5d4">
        <animate attributeName="stop-color" values="#00f5d4;#00f2fe;#4facfe;#00f5d4" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="30%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#7928ca" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters & Glows -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="30" cy="0" r="1" fill="#00f2fe" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes scanline {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(350px); opacity: 0; }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes floatChip {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .hud-scanner {
      animation: scanline 5s linear infinite;
    }
    .pulse-online {
      animation: pulseDot 2s ease-in-out infinite;
      transform-origin: 105px 44px;
    }
    .cursor-blink {
      animation: blink 1s step-end infinite;
    }
    .chip-1 { animation: floatChip 4s ease-in-out infinite 0.1s; }
    .chip-2 { animation: floatChip 4s ease-in-out infinite 0.5s; }
    .chip-3 { animation: floatChip 4s ease-in-out infinite 0.9s; }
    .chip-4 { animation: floatChip 4s ease-in-out infinite 1.3s; }
    .chip-5 { animation: floatChip 4s ease-in-out infinite 1.7s; }
    .chip-6 { animation: floatChip 4s ease-in-out infinite 2.1s; }
  </style>

  <!-- Background Base -->
  <rect width="960" height="340" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="960" height="340" rx="16" fill="url(#cyberGrid)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="150" cy="80" r="140" fill="#00f2fe" fill-opacity="0.06" filter="url(#neonGlow)" />
  <circle cx="850" cy="200" r="160" fill="#7928ca" fill-opacity="0.07" filter="url(#neonGlow)" />
  <circle cx="500" cy="300" r="120" fill="#00f5d4" fill-opacity="0.04" filter="url(#neonGlow)" />

  <!-- Scanner Line Effect -->
  <g class="hud-scanner">
    <line x1="20" y1="0" x2="940" y2="0" stroke="url(#accentLine)" stroke-width="2" />
  </g>

  <!-- HUD Outer Tech Frame Corners -->
  <path d="M 30 50 L 30 30 L 50 30" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 930 50 L 930 30 L 910 30" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 30 290 L 30 310 L 50 310" fill="none" stroke="#7928ca" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 930 290 L 930 310 L 910 310" fill="none" stroke="#7928ca" stroke-width="2.5" stroke-linecap="round" />

  <!-- Status HUD Bar Top -->
  <g transform="translate(45, 30)">
    <rect width="365" height="28" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
    <circle cx="20" cy="14" r="5" fill="#10b981" class="pulse-online" filter="url(#softGlow)" />
    <text x="34" y="18" fill="#94a3b8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.2">SYSTEM: ONLINE</text>
    <text x="145" y="18" fill="#334155" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11">|</text>
    <text x="160" y="18" fill="#38bdf8" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">FULL-STACK &amp; QA ENGINEER</text>
  </g>

  <g transform="translate(735, 30)">
    <rect width="180" height="28" rx="6" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="18" fill="#00f5d4" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">● HIREABLE</text>
    <text x="95" y="18" fill="#64748b" font-family="'Courier New', monospace" font-size="10">v2.4.0_PROD</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(45, 140)">
    <!-- Cyber Sub-Tag -->
    <text x="2" y="-30" fill="#00f2fe" font-family="'Courier New', monospace" font-size="13" font-weight="700" letter-spacing="3">INITIALIZING DIGITAL BUILDER INTERFACE //</text>
    
    <!-- Hero Name -->
    <text x="0" y="25" fill="url(#cyberText)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="1.5" filter="url(#softGlow)">
      TANMAY BHAR
    </text>
    
    <!-- Subtitle / Role -->
    <text x="2" y="58" fill="#e2e8f0" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="1">
      FULL-STACK ARCHITECT <tspan fill="#38bdf8">//</tspan> REACT 19 <tspan fill="#38bdf8">//</tspan> NODE.JS <tspan fill="#38bdf8">//</tspan> QA ENTHUSIAST
    </text>

    <!-- Typing Mission Statement -->
    <g transform="translate(0, 92)">
      <rect x="0" y="-18" width="570" height="26" rx="4" fill="#080f1e" stroke="#1e293b" stroke-width="0.8" />
      <text x="12" y="-1" fill="#38bdf8" font-family="'Courier New', monospace" font-size="12" font-weight="700">&gt;</text>
      <text x="28" y="-1" fill="#cbd5e1" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="12.5" font-weight="500">
        Turning bold ideas into scalable, high-performance web systems
      </text>
      <rect x="475" y="-13" width="7" height="15" fill="#00f2fe" class="cursor-blink" />
    </g>
  </g>

  <!-- Right Side Interactive Graphic / Telemetry Badges -->
  <g transform="translate(680, 100)">
    <!-- Decorative Tech Card Base -->
    <rect width="235" height="195" rx="12" fill="#090e1a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.2" />
    
    <!-- Header of mini card -->
    <rect width="235" height="32" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="0.8" />
    <circle cx="18" cy="16" r="4" fill="#ef4444" />
    <circle cx="32" cy="16" r="4" fill="#eab308" />
    <circle cx="46" cy="16" r="4" fill="#22c55e" />
    <text x="65" y="20" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11" font-weight="600">core_stack.json</text>

    <!-- Floating Technology Chips -->
    <!-- Chip 1: React 19 -->
    <g transform="translate(15, 48)" class="chip-1">
      <rect width="98" height="28" rx="6" fill="#0e1726" stroke="#00f2fe" stroke-width="0.8" stroke-opacity="0.8" />
      <text x="10" y="18" fill="#00f2fe" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">⚡ React 19</text>
    </g>

    <!-- Chip 2: TypeScript -->
    <g transform="translate(122, 48)" class="chip-2">
      <rect width="98" height="28" rx="6" fill="#0e1726" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.8" />
      <text x="10" y="18" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">🧠 TypeScript</text>
    </g>

    <!-- Chip 3: Node.js -->
    <g transform="translate(15, 84)" class="chip-3">
      <rect width="98" height="28" rx="6" fill="#0e1726" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.8" />
      <text x="10" y="18" fill="#22c55e" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">🚀 Node.js</text>
    </g>

    <!-- Chip 4: PHP 8 PDO -->
    <g transform="translate(122, 84)" class="chip-4">
      <rect width="98" height="28" rx="6" fill="#0e1726" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.8" />
      <text x="10" y="18" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">🐘 PHP 8</text>
    </g>

    <!-- Chip 5: MySQL -->
    <g transform="translate(15, 120)" class="chip-5">
      <rect width="98" height="28" rx="6" fill="#0e1726" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.8" />
      <text x="10" y="18" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">🗄️ MySQL</text>
    </g>

    <!-- Chip 6: QA / Testing -->
    <g transform="translate(122, 120)" class="chip-6">
      <rect width="98" height="28" rx="6" fill="#0e1726" stroke="#ec4899" stroke-width="0.8" stroke-opacity="0.8" />
      <text x="10" y="18" fill="#f472b6" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">🎯 QA &amp; Test</text>
    </g>

    <!-- Bottom Stat inside card -->
    <g transform="translate(15, 160)">
      <rect width="205" height="22" rx="4" fill="#030712" stroke="#1e293b" stroke-width="0.6" />
      <text x="12" y="15" fill="#64748b" font-family="'Courier New', monospace" font-size="10">STATUS: READY TO SHIP 🚀</text>
    </g>
  </g>

  <!-- Bottom Accent Divider Line -->
  <line x1="45" y1="315" x2="915" y2="315" stroke="url(#accentLine)" stroke-width="1.5" />
</svg>
